<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Matias Markelic - ships fast, holds up.">
  <title>Matias Markelic - full-stack developer &amp; designer</title>

  <!-- BONE -->
  <rect width="1280" height="400" fill="#F3F3F1"/>

  <!-- PRSTENOVI 1 : 1,618 : 2,618 -->
  <g fill="none">
    <circle cx="1330" cy="430" r="131" stroke="#22412F" stroke-width="2"/>
    <circle cx="1330" cy="430" r="212" stroke="#22412F" stroke-width="1.6" opacity="0.55"/>
    <circle cx="1330" cy="430" r="343" stroke="#0A0A0A" stroke-width="1.2" opacity="0.25"/>
  </g>

  <!-- NODE na orbiti -->
  <circle cx="1180" cy="280" r="5" fill="#22412F"/>

  <!-- ZNAK: M u prstenu, D = 44 -->
  <g transform="translate(107,68)">
    <circle cx="22" cy="22" r="20.68" fill="none" stroke="#0A0A0A" stroke-width="2.64"/>
    <text x="22" y="30.3" text-anchor="middle" fill="#0A0A0A"
          font-family="Montserrat, 'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
