    <circle cx="36.6" cy="7.4" r="2.64" fill="#22412F"/>
  </g>

  <!-- LOGOTIP -->
  <text x="167" y="99" fill="#0A0A0A"
        font-family="Montserrat, 'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
